<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Multi-spectral gradients -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="agriGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="agriGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="urbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="cropLines" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ca8a04" stroke-width="2" opacity="0.35"/>
    </pattern>
    <pattern id="urbanGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#334155"/>
      <rect x="2" y="2" width="12" height="12" fill="#475569"/>
      <rect x="5" y="5" width="6" height="6" fill="#94a3b8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base Terrain (Soil / Open Land) -->
  <rect width="800" height="600" fill="#292524"/>

  <!-- Agricultural Crop Plots -->
  <polygon points="40,30 360,40 340,240 60,220" fill="url(#agriGrad1)"/>
  <polygon points="40,30 360,40 340,240 60,220" fill="url(#cropLines)"/>
  <polygon points="370,40 760,30 740,220 350,230" fill="url(#agriGrad2)"/>
  <polygon points="370,40 760,30 740,220 350,230" fill="url(#cropLines)" opacity="0.5"/>

  <polygon points="50,240 320,250 300,420 40,400" fill="#3f6212"/>
  <polygon points="330,240 460,245 450,410 310,415" fill="#ca8a04" opacity="0.8"/>

  <!-- Dense Natural Forest Canopy (West & Southwest) -->
  <path d="M 30,380 Q 180,360 260,440 T 120,580 L 20,580 Z" fill="url(#forestGrad)"/>
  <circle cx="90" cy="460" r="55" fill="#14532d" opacity="0.7"/>
  <circle cx="160" cy="490" r="70" fill="#166534" opacity="0.7"/>
  <circle cx="210" cy="450" r="45" fill="#15803d" opacity="0.8"/>
  <circle cx="70" cy="530" r="60" fill="#14532d" opacity="0.8"/>

  <!-- Built-up Urban Sector (East & Southeast) -->
  <polygon points="480,260 760,250 780,560 460,570" fill="url(#urbanGrid)"/>
  <!-- Primary Highway / Road Network -->
  <path d="M 0,230 Q 350,240 800,240" stroke="#f8fafc" stroke-width="6" fill="none" opacity="0.75"/>
  <path d="M 470,0 L 470,600" stroke="#f8fafc" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M 620,240 L 620,600" stroke="#cbd5e1" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M 470,380 L 800,380" stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Hydrological System: Meandering River & Wetland -->
  <path d="M 220,0 C 260,120 180,200 240,320 C 300,440 380,500 370,600" stroke="url(#waterGrad)" stroke-width="42" fill="none" stroke-linecap="round"/>
  <path d="M 220,0 C 260,120 180,200 240,320 C 300,440 380,500 370,600" stroke="#38bdf8" stroke-width="8" fill="none" opacity="0.4"/>
  <!-- Wetland tributary -->
  <path d="M 240,320 Q 160,340 100,310" stroke="#0284c7" stroke-width="16" fill="none" opacity="0.85"/>
  <!-- River Oxbow lake -->
  <ellipse cx="290" cy="180" rx="35" ry="20" fill="url(#waterGrad)"/>

  <!-- Remote Sensing Coordinate Grid Overlay -->
  <g stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,6" opacity="0.35">
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Telemetry Corner HUD Elements -->
  <text x="16" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" opacity="0.85">SENTINEL-2 MSI • BAND COMBINATION: 4-3-2 (TRUE COLOR)</text>
  <text x="16" y="40" fill="#94a3b8" font-family="monospace" font-size="10" opacity="0.75">LAT 45°24'12"N • LON 09°16'44"E • GSD: 10m/px</text>
  <text x="660" y="24" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" opacity="0.85">STATUS: CALIBRATED</text>
</svg>
